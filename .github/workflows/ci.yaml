name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: ${{ matrix.preset }}-${{ matrix.config }}-${{ matrix.sanitize }}
    strategy:
      fail-fast: false
      matrix:
        preset: [ linux-clang, linux-gcc, macos, windows ]
        config: [ Debug, Release ]
        sanitize: [ address, undefined, memory ]
        exclude:
          - { preset: linux-gcc, sanitize: memory }
          - { preset: macos, sanitize: memory }
          - { preset: windows, sanitize: undefined }
          - { preset: windows, sanitize: memory }
        include:
          - { preset: linux-clang, os: ubuntu-latest }
          - { preset: linux-gcc, os: ubuntu-latest }
          - { preset: macos, os: macos-latest }
          - { preset: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake --log-level=VERBOSE --preset ${{ matrix.preset }}
          -DZLIB_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} -C ${{ matrix.config }}

      - name: Install
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }} -t install

  build-mobile:
    name: ${{ matrix.preset }}-${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        preset: [ android, ios ]
        config: [ Debug, Release ]
        include:
          - { preset: android, os: ubuntu-latest }
          - { preset: ios, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake --log-level=VERBOSE --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }}

      - name: Install
        run: cmake --build --preset ${{ matrix.preset }} --config ${{ matrix.config }} -t install

  build-freebsd:
    name: freebsd-${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Release ]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: freebsd {0}
    steps:
      - uses: actions/checkout@v7
      - name: Start VM
        uses: vmactions/freebsd-vm@v1

      - name: Install dependencies
        run: pkg install -y cmake-core ninja

      - name: Configure
        run: >
          cmake --log-level=VERBOSE -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          -DZLIB_INSTALL=ON
          -DZLIB_TEST=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build -V -C ${{ matrix.config }}

      - name: Install
        run: cmake --install build

  build-msys2:
    name: msys2-${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Release ]
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          pacboy: >-
            cmake:p gcc:p ninja:p

      - name: Configure
        run: >
          cmake --log-level=VERBOSE -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          -DZLIB_INSTALL=ON
          -DZLIB_TEST=ON

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest -V -C ${{ matrix.config }}

      - name: Install
        run: cmake --install build

  build-cygwin:
    name: cygwin-${{ matrix.config }}
    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Release ]
    runs-on: windows-latest
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -o igncr -eo pipefail '{0}'
    steps:
      - uses: actions/checkout@v7
      - uses: cygwin/cygwin-install-action@v6
        with:
          packages: cmake gcc-core ninja

      - name: Configure
        run: >
          cmake --log-level=VERBOSE -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          -DZLIB_INSTALL=ON
          -DZLIB_TEST=ON

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest -V -C ${{ matrix.config }}

      - name: Install
        run: cmake --install build
